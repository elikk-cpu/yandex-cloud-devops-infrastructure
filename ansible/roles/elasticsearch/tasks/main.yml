---
- name: Install Elasticsearch dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true
  become: true

- name: Download Elastic GPG key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /tmp/GPG-KEY-elasticsearch
    mode: "0644"
  become: true

- name: Install Elastic GPG key
  ansible.builtin.shell: |
    gpg --dearmor --yes \
      -o /usr/share/keyrings/elasticsearch-keyring.gpg \
      /tmp/GPG-KEY-elasticsearch
  args:
    creates: /usr/share/keyrings/elasticsearch-keyring.gpg
  become: true

- name: Add Elastic repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/9/ stable main"
    filename: elastic-9.x
    state: present
  become: true

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: true
  become: true

- name: Remove auto-configured Elasticsearch TLS secure settings
  ansible.builtin.shell: |
    changed=0

    for key in \
      xpack.security.http.ssl.keystore.secure_password \
      xpack.security.transport.ssl.keystore.secure_password \
      xpack.security.transport.ssl.truststore.secure_password
    do
      if /usr/share/elasticsearch/bin/elasticsearch-keystore list | grep -qx "$key"; then
        /usr/share/elasticsearch/bin/elasticsearch-keystore remove "$key"
        echo "REMOVED: $key"
        changed=1
      fi
    done
  register: elasticsearch_keystore_cleanup
  changed_when: "'REMOVED:' in elasticsearch_keystore_cleanup.stdout"
  become: true

- name: Deploy Elasticsearch configuration
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  become: true
  notify: Restart Elasticsearch

- name: Enable and start Elasticsearch
  ansible.builtin.service:
    name: elasticsearch
    enabled: true
    state: started
  become: true
